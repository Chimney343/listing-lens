[project]
name = "listing-lens"
version = "0.1.0"
description = "listing-lens"
authors = [
    {name = "mkkom"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "scrapy (>=2.14)",
    "scrapy-impersonate (>=1.6)",
    "scrapy-fake-useragent (>=1.3)",
    "pillow (>=10.4)",
    "pydantic (>=2.9)",
    "scrapy-playwright (>=0.0.46,<0.0.47)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-mock = "^3.15.1"
pytest-cov = "^7.0.0"
freezegun = "^1.5.5"

