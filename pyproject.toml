[project]
name = "listing-lens"
version = "0.1.0"
description = "listing-lens"
authors = [
    {name = "mkkom"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "scrapy (>=2.14)",
    "scrapy-impersonate (>=1.6)",
    "scrapy-fake-useragent (>=1.3)",
    "pillow (>=10.4)",
    "pydantic (>=2.9)",
    "scrapy-playwright (>=0.0.46,<0.0.47)",
    "psycopg[binary] (>=3.1)",
    "structlog (>=24.1.0)",
    "psycopg-pool (>=3.3.0,<4.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "presidio-analyzer (>=2.2,<3) ; python_version >= \"3.11\" and python_version < \"3.14\"",
    "presidio-anonymizer (>=2.2,<3) ; python_version >= \"3.11\" and python_version < \"3.14\"",
    "apscheduler (>=3.11.2,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-mock = "^3.15.1"
pytest-cov = "^7.0.0"
freezegun = "^1.5.5"

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = [".", "scrapy_project"]
